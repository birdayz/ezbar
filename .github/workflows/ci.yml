name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check known malicious lockfile versions before Cargo
        run: python3 scripts/check-lock.py --self-test && python3 scripts/check-lock.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-test:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check known malicious lockfile versions before Cargo
        run: python3 scripts/check-lock.py --self-test && python3 scripts/check-lock.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev dbus xvfb xauth
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Isolated tray protocol tests
        run: |
          EZBAR_TRAY_TEST_BUS=1 dbus-run-session -- cargo test --locked --lib isolated_bus_protocols -- --ignored
          EZBAR_TRAY_TEST_X11=1 xvfb-run -a cargo test --locked --lib isolated_xembed_protocols -- --ignored
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check known malicious lockfile versions before Cargo
        run: python3 scripts/check-lock.py --self-test && python3 scripts/check-lock.py
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
