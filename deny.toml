# cargo-deny config — https://embarkstudios.github.io/cargo-deny/
# CI runs: cargo deny check advisories bans sources

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained (archived) but benign; pulled in transitively by wgpu.
    "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# our workspace-internal crates are path deps with no version — that's fine
allow-wildcard-paths = true
# Known supply-chain incident versions. scripts/check-lock.py also runs before
# compilation, without building cargo-deny or any project dependency.
deny = [
    { name = "arrayref", version = "=0.3.10" },
    { name = "proc-macro1" },
    { name = "internment", version = "=0.8.7" },
    { name = "append-only-vec", version = "=0.1.9" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Licenses are not enforced in CI yet. To turn it on, add `licenses` to the
# cargo-deny command in .github/workflows/ci.yml and pin an allow-list here, e.g.:
# [licenses]
# version = 2
# allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause",
#          "ISC", "Unicode-3.0", "Zlib", "MPL-2.0"]
